# Local development infrastructure for Thread.
# Only PostgreSQL (with the pgvector extension) runs in Docker; the API,
# worker and frontend run on the host so they are easy to debug.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: thread-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only; 5434 avoids clashing with other local Postgres servers.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - thread-db-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  thread-db-data:
