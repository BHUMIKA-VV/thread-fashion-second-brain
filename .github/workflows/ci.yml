# Checks on every push to main and every pull request: backend lint and tests, frontend lint,
# types, unit tests, production build and a dependency audit. Nothing here deploys, and no
# secrets are used: the tests run with payments, email and Claude off (backend/tests/conftest.py).
#
# Third-party actions are pinned to full commit SHAs (the tag is in the comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # A throwaway database for this run only; not a secret.
          POSTGRES_USER: thread
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: thread_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thread -d thread_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The tests create and drop disposable databases next to thread_test.
      THREAD_TEST_DATABASE_URL: postgresql+psycopg://thread:ci-only-not-a-secret@127.0.0.1:5432/thread_test
      # Settings need a database URL to load; the tests never use this one.
      THREAD_DATABASE_URL: postgresql+psycopg://thread:ci-only-not-a-secret@127.0.0.1:5432/thread_test
      # A missing test database fails the run instead of skipping the database tests.
      THREAD_REQUIRE_TEST_DB: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        # PyTorch first, from its CPU-only index (as in backend/Dockerfile): the default Linux
        # wheel bundles gigabytes of CUDA libraries the tests never use.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
          pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check . ../database/migrations
          ruff format --check .
      - name: Pytest
        # -rs lists every skip and its reason in the log. Tests that need the real OpenCLIP
        # weights (marked ml) skip here: CI doesn't download the model.
        run: python -m pytest -q -rs

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The same Node as frontend/Dockerfile.
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
